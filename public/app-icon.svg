      <path d="M352.0 246.0 L432.0 228.0 L357.0 -85.5 Z" fill="url(#horn)" stroke="#E7C873" stroke-width="7" stroke-linejoin="round"/>
      <path d="M350.9 208.8 L420.7 178.4 M351.8 167.9 L411.1 138.7 M352.6 127.1 L401.5 98.9 M353.5 86.2 L391.9 59.2 M354.3 45.3 L382.3 19.4 M355.1 4.4 L372.7 -20.3 M356.0 -36.4 L363.1 -60.1" clip-path="url(#hornclip)" stroke="#E7A41B" stroke-width="12" stroke-linecap="butt" fill="none"/>
      <path d="M369.3 219.9 L362.4 -20.8" clip-path="url(#hornclip)" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.7" fill="none"/>
      <path d="M351.4 240.0 L431.4 222.0" stroke="#E7A41B" stroke-width="16" stroke-linecap="round" fill="none"/>
      <ellipse cx="470" cy="404" rx="24" ry="38" fill="#2E2723" transform="rotate(-22 470 404)"/>
      <ellipse cx="578" cy="470" rx="24" ry="38" fill="#2E2723" transform="rotate(-22 578 470)"/>
      <path d="M492 500 Q536 532 586 520" fill="none" stroke="#2E2723" stroke-width="18" stroke-linecap="round"/>
    </g></g>
    <path d="M806 214 L822 262 L870 278 L822 294 L806 342 L790 294 L742 278 L790 262 Z" fill="#FFC234"/>
    <path d="M232 806 L242 836 L272 846 L242 856 L232 886 L222 856 L192 846 L222 836 Z" fill="#8FE0FF" opacity="0.9"/>
