<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Unicorn</title>
  <desc id="desc">A friendly yellow cursor with a long ivory horn with a gold spiral and a spark, on a dark brown app tile.</desc>
  <defs>
    <clipPath id="tile"><rect width="1024" height="1024" rx="224"/></clipPath>
    <linearGradient id="body" x1="20%" y1="8%" x2="78%" y2="96%">
      <stop offset="0" stop-color="#FFF4D2"/>
      <stop offset="0.45" stop-color="#FFD25E"/>
      <stop offset="1" stop-color="#E7A41B"/>
    </linearGradient>
    <linearGradient id="horn" x1="0" y1="1" x2="0.4" y2="0">
      <stop offset="0" stop-color="#F3E2B3"/>
      <stop offset="1" stop-color="#FFFBEA"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="62%">
      <stop offset="0" stop-color="#4A3E37"/>
      <stop offset="1" stop-color="#2E2723"/>
    </radialGradient>
  </defs>
  <g clip-path="url(#tile)">
